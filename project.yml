name: FolioiOS

options:
  bundleIdPrefix: com.sriramb
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  FolioiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # Shared core (compiled into the iOS app directly — same files as the macOS
    # SwiftPM target) plus the iOS-only UI. macOS-only code (Editors/, Views/,
    # FolioApp.swift) is deliberately excluded.
    sources:
      - path: Sources/Folio/Models
      - path: Sources/Folio/Reading
      - path: Sources/Folio/Storage
      - path: iOS
      # The app icon. macOS gets its icon from Resources/AppIcon/Folio.icns
      # instead, so this catalog is only ever compiled into the iOS app.
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sriramb.folio
        PRODUCT_NAME: Folio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.0"
